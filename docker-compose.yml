services:
  mcp-service:
    build: .
    image: mcp-service:0.2.0
    container_name: mcp-service
    ports:
      - "4950:8080"            # host:container — direct probing
    environment:
      MCP_DATA_DIR: /data
      # Where the SDLC Brain tools find the knowledge base and write assessments.
      SDLC_RO_DIR: /sdlc/ro
      SDLC_RW_DIR: /sdlc/rw
      # Reaches the isolated browser service over mcp_internal.
      WEBSEARCH_URL: "http://websearch_server:8080"
      # Admin (write) bearer token. Set in ./.env; empty = open (dev only).
      MCP_ADMIN_TOKEN: "${MCP_ADMIN_TOKEN:-}"
      # App keys (console_specification.md section 4.1): 1 = every call needs a key; 0 = read-tier tools
      # still answer anonymous calls while consumers are given keys. Write-tier tools always need one.
      MCP_REQUIRE_KEYS: "${MCP_REQUIRE_KEYS:-0}"
      # Sign-in (section 4.10): the domain proxy (oauth2-proxy-entra, Microsoft Entra ID) forwards the person as
      # X-Auth-Request-Email with X-Mcp-Proxy-Secret; the service trusts the address only with this secret
      # (./.env, and proxy_server/conf/secrets/mcp-console.conf). MCP_ADMIN_EMAILS: who may write (empty = anyone
      # the proxy's allow-list admitted).
      MCP_PROXY_SECRET: "${MCP_PROXY_SECRET:-}"
      MCP_ADMIN_EMAILS: "${MCP_ADMIN_EMAILS:-}"
      # OAuth 2.1 (app/oauth.py): the issuer and the resource's public address, where MCP clients reach the service.
      MCP_PUBLIC_URL: "${MCP_PUBLIC_URL:-https://logus2k.com/mcp-console}"
      # The person's own name and photo (app/identity.py, as Cortex): the proxy forwards Microsoft Graph's access
      # token; the ID token is the sign-out hint. {logout_hint} is filled from it.
      MCP_USERINFO_URL: "${MCP_USERINFO_URL:-https://graph.microsoft.com/oidc/userinfo}"
      MCP_PHOTO_URL: "${MCP_PHOTO_URL:-https://graph.microsoft.com/v1.0/me/photos/96x96/$$value}"
      MCP_SIGN_OUT_URL: "${MCP_SIGN_OUT_URL:-/oauth2-entra/sign_out?rd=https%3A%2F%2Flogin.microsoftonline.com%2Fcommon%2Foauth2%2Fv2.0%2Flogout%3Fpost_logout_redirect_uri%3Dhttps%253A%252F%252Flogus2k.com%252Fmcp-console%252Fadmin{logout_hint}}"
      # The invocation record (section 4.2): keep read-tier arguments (1) or digests only (0); days kept.
      MCP_RECORD_ARGS: "${MCP_RECORD_ARGS:-0}"
      MCP_RETENTION_DAYS: "${MCP_RETENTION_DAYS:-90}"
      # Jenkins, for the console's backend health (the SDLC sensors reach it over ci-network).
      JENKINS_URL: "${JENKINS_URL:-http://jenkins_master:8080}"
      # nginx_register_app tool: where the proxy's conf is mounted + which container to validate/reload.
      PROXY_CONF_DIR: /proxy-conf
      PROXY_CONTAINER: proxy_server
    # NewsAPI key for the newsapi_search tool lives in the GITIGNORED secrets.env.
    # This survives a
    # plain `docker compose up` with no host export. Empty/missing => the tool
    # returns a clear "not configured" error.
    env_file:
      - secrets.env
    volumes:
      - ./data:/data           # registry.json, history.json, keys.json, activity.db
      # SDLC Brain tools: the knowledge base is reference material (read-only) and
      # the assessment state is per-tenant data the tools write. Kept in the sdlc
      # project so a maturity conclusion sits next to the KB it was judged against.
      - ${SDLC_RO_DIR_HOST:-../sdlc/data/ro}:/sdlc/ro:ro
      - ${SDLC_RW_DIR_HOST:-../sdlc/data/rw}:/sdlc/rw
      # Assessed projects' working trees, READ-ONLY. Scan cells detect a practice by the
      # artifact that embodies it (tests, ADRs, CI gates), so they must see the source —
      # and must never be able to touch it.
      - ${CV_REPO_HOST:-../cv}:/sdlc/repos/cv:ro
      # The uptime monitor's database, READ-ONLY. Operational outcomes (uptime,
      # recovery time) come from its heartbeat history; the sensor reads a COPY so
      # it can never disturb the monitor that production depends on.
      - ${MONITORING_DATA_HOST:-../monitoring/data}:/sdlc/monitoring:ro
      # nginx_register_app tool: the domain proxy's conf (rw, writes apps/<suffix>.conf) + the docker
      # socket (to `docker exec proxy_server nginx -t / -s reload`). This is the sanctioned, validated
      # way to register a generated app behind oauth2-proxy.
      - ../proxy_server/conf:/proxy-conf
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cortex-kb              # Cortex reaches mcp-service here (other apps: docker-compose.local.yml)
      - mcp_internal           # mcp-service reaches websearch_server here
      - ci-network             # the Brain's delivery sensor reaches Jenkins here
      - logus2k_network        # the SDLC wall reaches this service to record answers
    restart: unless-stopped

networks:
  cortex-kb:
    external: true
  mcp_internal:
    external: true
  ci-network:
    external: true
  logus2k_network:
    external: true
